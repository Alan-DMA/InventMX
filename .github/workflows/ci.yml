name: Nexus v3 CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Pytest & RLS Multi-Tenant Security Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexus_user
          POSTGRES_PASSWORD: nexus_password
          POSTGRES_DB: nexus_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-asyncio httpx coverage

      - name: Run Pytest Suite (Days 1 to 16)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://nexus_user:nexus_password@localhost:5432/nexus_test_db
          ENVIRONMENT: testing
          SECRET_KEY: test-ci-cd-secret-key-32-chars-long!!
        run: |
          pytest tests/ -v --durations=10

  frontend-analyze:
    name: Flutter Static Analysis & DTO Typing Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.x'
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Flutter Static Analysis
        working-directory: frontend
        run: flutter analyze lib/
