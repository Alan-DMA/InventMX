name: nexus_app
description: Nexus v3.0 — Sistema de Gestión Comercial para Retail México
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Rutas limpias en web (`/tienda/...` sin `#`): WhatsApp no linkifica URLs
  # con fragmento. Paquete del propio SDK, no es dependencia externa.
  flutter_web_plugins:
    sdk: flutter

  # --- Estado ---
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # --- Navegación ---
  go_router: ^13.2.0

  # --- Red / HTTP ---
  dio: ^5.4.3
  # Canal en vivo de pedidos web (WS /ws/orders) — paquete oficial de Dart,
  # ya venía como transitiva; cubre móvil y web con la misma API.
  web_socket_channel: ^3.0.0

  # --- Almacenamiento local ---
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0

  # --- Tipografía ---
  google_fonts: ^6.2.1

  # --- Utilidades ---
  equatable: ^2.0.5
  share_plus: ^10.1.4
  path_provider: ^2.1.6

  # --- Importación de archivos ---
  file_picker: ^8.1.2           # Selector de archivos Excel/CSV (Android/iOS/Web)

  # --- Foto de producto tomada con la cámara nativa (sin salir de la app) ---
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0 # Comprime foto/archivo antes de subir (Sep 2026)

  # --- Escaneo de códigos de barras ---
  mobile_scanner: ^6.0.0        # Escaneo continuo EAN/QR/Code128 (Tarea 5.2)

  # --- Generación de QR ---
  qr_flutter: ^4.1.0            # QR de validación en ticket de venta (Tarea 8.2)

  # --- Llamada / WhatsApp directo desde Directorio de Proveedores ---
  url_launcher: ^6.3.1          # tel: / https://wa.me/ (Tarea 11.2.2)

  # --- OCR On-Device de facturas (Tarea 12.2) ---
  google_mlkit_text_recognition: ^0.17.1  # ML Kit local, costo $0 (Constitucion Art. II / VII)
  # --- Dictado de voz nativo (Tarea 12.2.3 / SR-09) ---
  speech_to_text: ^7.4.0                  # Android SpeechRecognizer / Web Speech API
  camera: ^0.12.1
  pdfx: ^2.11.0                           # Render de PDF a imagen on-device para OCR (Tarea 12.2 / Q-03)

dev_dependencies:
  flutter_test:
    sdk: flutter

  # --- Generación de código Riverpod ---
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.3
  custom_lint: 0.7.6
  riverpod_lint: ^2.3.13

  # --- Análisis estático ---
  flutter_lints: ^3.0.0

  # --- Tests ---
  mocktail: ^1.0.4
  hive_test: ^1.0.1

flutter:
  uses-material-design: true
